# Standalone development snapshot. No external volumes or existing runtime adapters.
x-app: &app
  image: ${CW_IMAGE:?}
  env_file: ${CW_SECRET_FILE:?}
  working_dir: /app
  entrypoint: ["sh", "/app/docker/isolated/entrypoint.sh"]
  environment: &environment
    RAILS_ENV: development
    NODE_ENV: development
    FRONTEND_URL: http://localhost:${CW_RAILS_PORT:?}
    RAILS_LOG_TO_STDOUT: "true"
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_USERNAME: postgres
    POSTGRES_DATABASE: ${CW_DATABASE:?}_dev
    REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379/0
    SMTP_ADDRESS: mailhog
    SMTP_PORT: "1025"
    ACTIVE_STORAGE_SERVICE: local
    VITE_RUBY_HOST: vite
    VITE_RUBY_PORT: ${CW_VITE_PORT:?}
  volumes: &app-volumes
    - ${CW_SOURCE:?}:/app
    - node_modules:/app/node_modules
    - storage:/app/storage
    - tmp:/app/tmp
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  base:
    profiles: ["build"]
    image: ${CW_IMAGE:?}
    build:
      context: ${CW_BUILD_SOURCE:?}
      dockerfile: ${CW_DOCKERFILE:?}
      args:
        CHATWOOT_SOURCE_COMMIT: ${CW_COMMIT:?}
        BUNDLE_WITHOUT: ""
        EXECJS_RUNTIME: Node
        RAILS_ENV: development
        RAILS_SERVE_STATIC_FILES: "false"
  rails:
    <<: *app
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]
    ports:
      - "127.0.0.1:${CW_RAILS_PORT:?}:3000"
  sidekiq:
    <<: *app
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
  vite:
    <<: *app
    environment:
      <<: *environment
      VITE_RUBY_HOST: 0.0.0.0
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: vite
    command: ["bin/vite", "dev"]
    ports:
      - "127.0.0.1:${CW_VITE_PORT:?}:${CW_VITE_PORT:?}"
  test:
    <<: *app
    profiles: ["test"]
    environment:
      <<: *environment
      RAILS_ENV: test
      POSTGRES_DATABASE: ${CW_DATABASE:?}_test
      REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379/1
    volumes:
      - ${CW_SOURCE:?}:/app
      - node_modules:/app/node_modules
      - test_storage:/app/storage
      - test_tmp:/app/tmp
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${CW_DATABASE:?}_dev
      PGDATA: /data/postgres
    volumes:
      - postgres:/data/postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${CW_DATABASE:?}_dev"]
      interval: 3s
      timeout: 3s
      retries: 30
  redis:
    image: redis:alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    command: ["sh", "-c", 'exec redis-server --requirepass "$$REDIS_PASSWORD" --dir /data --appendonly yes']
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 3s
      timeout: 3s
      retries: 30
  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "127.0.0.1:${CW_MAIL_PORT:?}:8025"

volumes:
  postgres:
  redis:
  node_modules:
  storage:
  tmp:
  test_storage:
  test_tmp:

